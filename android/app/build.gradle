plugins {
    id 'com.android.application'
}

// Keep the app version in sync with the version in the top-level meson.build.
def mesonBuild = new File(rootDir, '../meson.build').text
def vkmarkVersion = (mesonBuild =~ /version\s*:\s*'([^']+)'/)[0][1]

android {
    namespace 'org.vkmark.android'
    compileSdk 36
    ndkVersion '27.3.13750724'

    defaultConfig {
        applicationId 'org.vkmark.android'
        // Vulkan is available from Android 7.0 (API level 24).
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName vkmarkVersion

        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }

        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_static',
                          '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON',
                          "-DVKMARK_VERSION=${vkmarkVersion}"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Sign release builds with the debug key so that the optimized
            // build can be installed directly. Replace this with a proper
            // signing configuration for distribution.
            signingConfig signingConfigs.debug
        }
    }

    sourceSets {
        main {
            // Package the vkmark data files (shaders, models, textures) as assets.
            assets.srcDirs = ['../../data']
        }
    }

    androidResources {
        // Only the compiled SPIR-V shaders are needed at runtime.
        ignoreAssetsPattern '!meson.build:!*.frag:!*.vert'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}
